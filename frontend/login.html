<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Healthcare App - Login/Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Roboto", sans-serif;
    }

    body,
    html {
      height: 100%;
    }

    body {
      background: url('https://static.vecteezy.com/system/resources/previews/002/242/081/non_2x/portrait-of-a-female-doctor-in-uniform-with-a-tablet-and-a-stethoscope-on-a-white-background-flat-image-vector.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 400px;
      padding: 45px 40px;
      border-radius: 20px;
      margin-right: 10%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h2 {
      text-align: center;
      color: #023e8a;
      margin-bottom: 25px;
      font-weight: 700;
      font-size: 28px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    input:focus,
    select:focus {
      border-color: #0077b6;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 119, 182, 0.3);
      background: #fff;
    }

    button {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 16px;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(2, 62, 138, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 62, 138, 0.6);
    }

    #message {
      font-weight: 600;
      text-align: center;
      margin: 10px 0;
      color: #d62828;
    }

    .toggle-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      cursor: pointer;
      color: #0077b6;
      font-weight: 500;
      transition: color 0.2s;
    }

    .toggle-btn:hover {
      color: #023e8a;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="message"></div>

    <!-- Signup Form -->
    <form id="signupForm">
      <h2>Signup</h2>
      <input type="text" id="signupName" placeholder="Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <select id="signupRole" required>
        <option value="">Select Role</option>
        <option value="doctor">Doctor</option>
        <option value="staff">Staff</option>
      </select>
      <button type="submit">Sign Up</button>
      <div class="toggle-btn" id="toLogin">Already have an account? Login</div>
    </form>

    <!-- Login Form -->
    <form id="loginForm" class="hidden">
      <h2>Login</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
      <div class="toggle-btn" id="toSignup">Don't have an account? Sign Up</div>
    </form>
  </div>

  <script>
    const AUTH_API = "https://healthcare-app-2025-ta9n.onrender.com/auth";
    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const messageDiv = document.getElementById("message");

    // Toggle forms
    document.getElementById("toLogin").addEventListener("click", () => {
      signupForm.classList.add("hidden");
      loginForm.classList.remove("hidden");
      messageDiv.innerText = "";
    });

    document.getElementById("toSignup").addEventListener("click", () => {
      loginForm.classList.add("hidden");
      signupForm.classList.remove("hidden");
      messageDiv.innerText = "";
    });

    function showMessage(msg, success = false) {
      messageDiv.style.color = success ? "green" : "red";
      messageDiv.innerText = msg;
    }

    // ✅ Signup
    // Signup form handler
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("signupName").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const role = document.getElementById("signupRole").value;

      try {
        const res = await fetch(`${AUTH_API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, role }),
        });

        const data = await res.json();
        if (res.ok) {
          alert("Signup successful!");
          localStorage.setItem("token", data.token); // ✅ Save token
          window.location.href = "index.html"; // redirect
        } else {
          alert(data.error || "Signup failed");
        }
      } catch (err) {
        alert("Something went wrong during signup");
        console.error(err);
      }
    });

    // Login form handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch(`${AUTH_API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (res.ok) {
          alert("Login successful!");
          localStorage.setItem("token", data.token); // ✅ Save token
          window.location.href = "index.html"; // redirect
        } else {
          alert(data.error || "Login failed");
        }
      } catch (err) {
        alert("Something went wrong during login");
        console.error(err);
      }
    });

  </script>
</body>

</html>
